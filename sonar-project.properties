sonar.organization=shopmonkeyus
sonar.projectKey=shopmonkeyus_eds
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go,\
  **/__tests__/**

# Not analysed at all:
# - tests, also listed here because SonarCloud's new analysis scope ignores
#   sonar.tests and sonar.test.inclusions
# - test data, generated code and vendored code
# - internal/osext, a copy of the Go authors' osext package
sonar.exclusions=\
  **/*_test.go,\
  **/__tests__/**,\
  **/testdata/**,\
  **/fixtures/**,\
  **/mocks/**,\
  **/golden/**,\
  **/*.pb.go,\
  **/vendor/**,\
  internal/osext/**

sonar.test.exclusions=\
  **/testdata/**,\
  **/fixtures/**,\
  **/mocks/**,\
  **/golden/**

# The e2e and integration test harnesses run against live destinations in
# .github/workflows/e2e.yaml, not in unit tests. main.go only starts the CLI.
sonar.coverage.exclusions=\
  main.go,\
  cmd/e2e.go,\
  cmd/integrationtest.go,\
  internal/e2e/**,\
  internal/integrationtest/**

# Written by the Go Unit Tests step in .github/workflows/go.yml.
sonar.go.coverage.reportPaths=coverage.out
